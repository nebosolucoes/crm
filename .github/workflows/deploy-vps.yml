name: Deploy na VPS (fork)

# O botão de deploy do FORK. Não dispara sozinho: só por "Run workflow" na aba
# Actions. Entra na VPS por SSH e roda `scripts/deploy-nebo.sh`, que puxa as
# imagens já publicadas pelo "Publicar imagem Docker (GHCR)" (o outro botão),
# reaplica o baseline.sql e sobe os contêineres.
#
# Ordem dos cliques: 1) Publicar imagem Docker (GHCR) → 2) este. O script recusa
# subir se a imagem no GHCR não for do commit que está na branch (a menos que
# `force` esteja marcado).
#
# Secrets do repositório (Settings › Secrets and variables › Actions):
#   VPS_HOST      IP ou host da VPS
#   VPS_USER      usuário do SSH (o mesmo que instalou o CRM)
#   VPS_SSH_KEY   chave PRIVADA (ed25519) cuja pública está no authorized_keys da VPS
#   VPS_PORT      (opcional) porta do SSH, default 22
#
# Registro: o GitHub só lista um workflow depois de um push que TOQUE o arquivo
# na branch padrão. Este ficou invisível na aba Actions após o push inicial do
# fork (2026-09-21); esta linha existe para o push que o registrou.

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do projeto na VPS (relativa ao home do usuário, ou absoluta)"
        default: "deskcommcrm"
        required: true
      skip_backup:
        description: "Pular o backup do banco antes do deploy"
        type: boolean
        default: false
      force:
        description: "Subir mesmo que a imagem no GHCR não seja deste commit"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Preparar a chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::secret VPS_SSH_KEY vazio"; exit 1; }
          [ -n "$VPS_HOST" ]    || { echo "::error::secret VPS_HOST vazio"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rodar o deploy na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          PASTA: ${{ inputs.pasta }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
          FORCE: ${{ inputs.force }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=""
          [ "$SKIP_BACKUP" = "true" ] && flags="$flags --skip-backup"
          [ "$FORCE" = "true" ]       && flags="$flags --force"
          # O clone da VPS e atualizado ANTES de invocar o script, e nao e
          # zelo: o passo 1 do proprio script faz `git merge`, que reescreve
          # o arquivo que o bash esta executando. O bash le script do disco
          # por OFFSET DE BYTE, conforme executa — trocar o arquivo debaixo
          # dele faz a leitura seguinte cair no meio de outra linha e rodar
          # pedaco de comando, possivelmente com os conteineres ja parados.
          #
          # Ate 22/09/2026 isso nunca mordeu porque o script nao mudava; o
          # commit que o fez parar os conteineres antes do baseline inseriu
          # 58 linhas no meio dele, bem na regiao ainda nao lida. Aqui o
          # merge acontece antes do primeiro byte ser lido, entao o bash ja
          # abre a versao nova; o script refaz o merge (vira no-op) e mantem
          # as recusas dele — arvore suja, branch errada, divergencia.
          #
          # `|| true` porque a falha nao e nossa de diagnosticar: se o merge
          # nao passa, o merge DENTRO do script tambem nao passa, e ele morre
          # com a mensagem boa em vez desta linha crua.
          #
          # Quem roda o script a mao por ssh nao passa por aqui — esse caminho
          # e coberto pelo reexec do passo 1 do script.
          # A pasta e a branch vão como argumentos citados; o resto é fixo.
          ssh -i ~/.ssh/vps -p "${VPS_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" \
            "set -e; cd $(printf '%q' "$PASTA"); { git fetch --quiet origin $(printf '%q' "$BRANCH") && git merge --ff-only --quiet origin/$(printf '%q' "$BRANCH"); } || true; DEPLOY_BRANCH=$(printf '%q' "$BRANCH") bash scripts/deploy-nebo.sh $flags"
